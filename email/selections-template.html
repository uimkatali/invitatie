<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{subject}}</title>
</head>
<body style="margin:0; padding:0; background-color:#3d2233;">
  <div style="display:none; max-height:0; overflow:hidden; font-size:1px; color:#3d2233;">{{preheader}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#3d2233;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background-color:#6b3a52; border-radius:12px; overflow:hidden;">
          <tr>
            <td style="padding:32px 28px; font-family:Georgia, 'Times New Roman', serif; color:#fff2e6;">
              <p style="margin:0 0 20px; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; color:#ff9ab0;">Selectii pentru urmatorul date</p>
              {{bodyHtml}}
              <p style="margin:24px 0 0; font-size:14px; color:#fff2e6;">Raspunde direct la acest email — merge la {{replyEmail}}.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
